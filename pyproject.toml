[project]
name = "tidytext"
version = "1.1.0"
description = "Clean up messy text: fix line breaks, extra spaces, invisible characters and letter case."
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammad Shehryar" }]
requires-python = ">=3.12"
# Runtime dependencies. Vercel installs these from here; keep requirements.txt
# (used by Docker) identical. tools/tests/test_packaging.py checks they match.
dependencies = [
    "Django==6.1.2",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # curly quotes and dashes in user-facing copy are intended

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S106"]
"tidytext/settings.py" = ["S105"]
