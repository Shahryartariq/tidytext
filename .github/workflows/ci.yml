name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, test and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: make install PYTHON=python
      - run: make lint
      - run: make test
      - run: make check
      - name: Audit dependencies for known vulnerabilities
        run: make audit

  e2e:
    name: Browser flows
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: make install PYTHON=python
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the site like production
        env:
          DJANGO_SECRET_KEY: ci-e2e-only-key
          DJANGO_DEBUG: "0"
        run: |
          .venv/bin/python manage.py collectstatic --noinput
          nohup .venv/bin/gunicorn tidytext.wsgi:application --config gunicorn.conf.py > gunicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          cat gunicorn.log; exit 1
      - run: npm run e2e
        env:
          TIDYTEXT_URL: http://127.0.0.1:8000
      - if: failure()
        run: cat gunicorn.log

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docker-build
      - name: Smoke test the container
        run: |
          docker run -d --name tidytext -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            -e DJANGO_SECRET_KEY=ci-smoke-test-key tidytext:latest
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          # The page renders the tool form, and a no-JavaScript post is cleaned on the server.
          curl -fsS http://127.0.0.1:8000/ | grep -q 'data-tool'
          curl -fsS --data-urlencode 'text=a    b' -d line_breaks=keep -d flags=remove_extra_spaces \
            http://127.0.0.1:8000/ | grep -q '>a b</textarea>'
      - if: always()
        run: docker logs tidytext
